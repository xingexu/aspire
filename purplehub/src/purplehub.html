<title>Purple Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Purple Hub: club events at Western, by USC.">
<style>
:root{
  /* Neutral and see-through: plain translucent boxes over a faded photo of Western. Purple is only an accent, for hover,
     focus and the walkthrough spotlight. The tab bar and tour card use liquid-glass-react (see glass.jsx). */
  color-scheme:light;
  --bg:#F5F5F7; --paper:#FFFFFF; --ink:#16161A; --ink-2:#2A2A30; --muted:#3F3F46;
  --accent:#4F2683; --accent-soft:rgb(79 38 131 / .08); --accent-card:rgb(245 240 253 / .74);
  --card:rgb(255 255 255 / .55);
  --line:rgb(0 0 0 / .12); --tint:rgb(0 0 0 / .06);
  --usc:#16161A; --usc-soft:rgb(255 255 255 / .55);
  --mark:#ECECEF; --on-mark:#16161A; --on-club:#16161A;
  --good:#0F5533; --good-soft:rgb(23 100 63 / .12); --warn:#633800; --warn-soft:rgb(170 110 0 / .14); --bad:#A61B12; --bad-soft:rgb(180 35 24 / .1);
  --screen:rgb(44 44 54 / .84); --screen-2:rgb(255 255 255 / .1); --screen-ink:#FFFFFF; --screen-muted:#F0F0F3; --bezel:#3A3A44;
  --rim:inset 0 0 0 1px rgb(255 255 255 / .55);
  --shadow:var(--rim), 0 8px 24px rgb(20 20 26 / .08);
  --glass:none;
  --usc-logo:url("{{USC_LOGO}}");
  --western:url("{{WESTERN_BG}}");
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-card:1.5rem; --r-ctl:999px; --tab-h:3.5rem; --tab-gap:0.5rem;
  --ease:cubic-bezier(.22,1,.36,1);
  --btn:rgb(255 255 255 / .86); --btn-shadow:inset 0 0 0 1px rgb(255 255 255 / .9),0 0 0 1px rgb(20 20 26 / .07),0 2px 4px rgb(20 20 26 / .06),0 6px 16px rgb(20 20 26 / .1);
  --fill:#5B5B66;
  --toast-lift:1.25rem; --ask-lift:1.25rem; --foot-pad:4.5rem;
  --tab-y:calc(env(safe-area-inset-top,0px) + 2.625rem);
}
*,*::before,*::after{box-sizing:border-box}
/* Scales with the window on a Mac and honours browser text-size settings; every size below is in rem. */
html{font-size:clamp(100%,75% + .28vw,118.75%);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:6rem}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100dvh}
.aurora{position:fixed;inset:0 0 auto;height:100lvh;z-index:-1;pointer-events:none;background:var(--western) 62% center/cover no-repeat;opacity:.3}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:0.375rem}
.wrap{max-width:75rem;margin:0 auto;padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:max(1rem,env(safe-area-inset-right,0px))}

/* top bar: brand and help sit on the page. The tab bar floats: top centre on a Mac, a bottom bar on a phone or tablet. */
.top{position:relative;z-index:13;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;min-height:5.25rem;padding-block:0.75rem}
.usc-logo{display:inline-block;flex:none;width:3rem;height:3rem;border-radius:50%;background:var(--usc-logo) center/contain no-repeat;box-shadow:0 4px 14px rgb(20 20 26 / .35)}
.brand{display:inline-flex;align-items:center;gap:0.75rem;text-decoration:none;min-width:0}
.brand-text{display:grid;gap:3px;min-width:0}
.brand-name{display:inline-flex;align-items:center;gap:0.4375rem;font:800 1.625rem/1 var(--font-display);letter-spacing:-.03em}
.brand .brand-by{font:500 0.7812rem/1.2 var(--font-body);color:var(--muted);white-space:nowrap}
@media (max-width:420px){.brand-name{font-size:1.25rem}}
.tab-anchor{position:fixed;z-index:14;left:50%;top:var(--tab-y);width:0;height:0}
.tabs{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;gap:2px;width:max-content;padding:0.3125rem;border-radius:999px;background:var(--card);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%)}
.tabs a{display:flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;padding:0.5625rem 1rem;min-height:2.5rem;border-radius:999px;color:var(--ink);font-weight:600;font-size:0.9375rem;line-height:1.1;transition:background .28s var(--ease),color .28s var(--ease)}
.tabs a:hover{background:var(--accent-soft);color:var(--accent)}
.tabs a{position:relative;z-index:1}
.tabs a[aria-current="page"],.tabs a[aria-current="page"]:hover{background:none;color:var(--ink);font-weight:700}
.tab-glider{position:absolute;left:0;top:0;border-radius:999px;background:#FFF;box-shadow:0 0 0 1px rgb(20 20 26 / .06),0 2px 8px rgb(20 20 26 / .16);pointer-events:none}
.tab-glider.ready{transition:transform .42s var(--ease),width .42s var(--ease),height .42s var(--ease)}
.lab-short{display:none}
.tab-icon{width:1.125rem;height:1.125rem;flex:none;margin-right:0.375rem}
/* Once the library has adopted the tabs, it draws the glass and the position. Its layers blend with the page, so the anchor
   must not be a stacking context (that would isolate them and leave the blur nothing to blur); each layer gets the z-index instead. */
.lg-on .tab-anchor{position:static;width:auto;height:auto}
.lg-on .tab-anchor > *{z-index:14!important}
.tabs,.tour-card{text-shadow:none}
.lg-on .tabs{position:relative;transform:none;background:rgb(255 255 255 / .4);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:999px}
.lg-on .tab-anchor .glass{display:flex!important;vertical-align:top}
.tab-anchor .pointer-events-none,.tour-anchor .pointer-events-none{pointer-events:none}
.lg-slot{display:block}
.lg-frost-only .glass__warp{filter:none!important;-webkit-backdrop-filter:blur(20px) saturate(170%)}
.lg-frost-only .tabs{background:rgb(255 255 255 / .82)}
@media (max-width:1199px){
  :root{--toast-lift:calc(var(--tab-h) + var(--tab-gap) + 0.875rem);--ask-lift:calc(var(--tab-h) + var(--tab-gap) + 0.75rem);--foot-pad:calc(var(--tab-h) + var(--tab-gap) + 4.5rem + env(safe-area-inset-bottom,0px));--tab-y:calc(100dvh - env(safe-area-inset-bottom,0px) - var(--tab-gap) - var(--tab-h) / 2)}
  html{scroll-padding-top:1rem;scroll-padding-bottom:calc(var(--tab-h) + 1.5rem)}
  .tabs{width:min(100vw - 1rem - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px),40rem);height:var(--tab-h)}
  .tabs a{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;padding:0.25rem 0;min-height:0;font-size:0.6875rem;font-weight:600;border-radius:999px}
  .tab-icon{margin:0}
  .lab-long{display:none}
  .lab-short{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  main.wrap{padding-bottom:2.5rem}
}
@media (max-width:420px){.brand-by{display:none}.usc-logo{width:2.625rem;height:2.625rem}}

main{padding-block:1.75rem 4.5rem}
.view{display:grid;gap:1.75rem}
.view-head{display:grid;gap:0.5rem;max-width:50rem}
.eyebrow{font:600 0.75rem/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 clamp(2.25rem,5.4vw,3.75rem)/1.02 var(--font-display);letter-spacing:-.03em;margin:2px 0 0.25rem;text-wrap:balance}
.h2{font:750 clamp(1.5rem,3vw,2rem)/1.1 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.h3{font:650 1.1875rem/1.25 var(--font-body);margin:0;letter-spacing:-.005em}
.lede{font-size:1.125rem;line-height:1.5;color:var(--ink-2);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:0.875rem}
.mono{font-family:var(--font-mono);letter-spacing:.02em}
.row{display:flex;gap:0.625rem;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.panel{background:var(--card);border-radius:var(--r-card);padding:1.25rem;box-shadow:var(--shadow);display:grid;gap:0.875rem;align-content:start;min-width:0}
:is(.panel,.poster,.kpi,.btn.ghost){-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
:is(.panel,.poster,.kpi){transition:box-shadow .32s var(--ease),background .32s var(--ease),transform .32s var(--ease)}
@media (hover:hover){:is(.poster,.kpi):hover{background:var(--accent-card);box-shadow:inset 0 0 0 1.5px var(--accent),0 12px 30px rgb(79 38 131 / .16);transform:translateY(-2px)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.125rem;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* buttons, chips */
.btn{appearance:none;border:0;background:var(--btn);color:var(--ink);box-shadow:var(--btn-shadow);font-weight:650;font-size:0.9688rem;padding:0.625rem 1rem;border-radius:var(--r-ctl);cursor:pointer;min-height:2.75rem;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;text-decoration:none;transition:transform .28s var(--ease),background .28s var(--ease),color .28s var(--ease),box-shadow .28s var(--ease)}
.btn:active{transform:scale(.97);transition-duration:.1s}
@media (hover:hover){.btn:not([disabled]):hover{color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),0 8px 20px rgb(79 38 131 / .16);transform:translateY(-1px)}}
.btn.ghost{background:rgb(255 255 255 / .34);color:var(--ink);box-shadow:var(--rim)}
.btn.small{min-height:2.375rem;padding:0.4375rem 0.8125rem;font-size:0.9062rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-weight:600;font-size:0.9062rem;min-height:1.2em}

/* tally mark */

/* posters (club event cards) */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(18.75rem,100%),1fr));gap:1.125rem}
.poster{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.club-line{display:flex;align-items:center;gap:0.625rem;font-weight:650;font-size:0.875rem;min-width:0}
.club-line span:last-child{overflow-wrap:anywhere}
.poster-title{font:800 1.6875rem/1.04 var(--font-display);letter-spacing:-.025em;margin:0.25rem 0 0;text-wrap:balance}
.poster-body{padding:1rem 1.125rem 1.125rem;display:grid;gap:0.5rem;flex:1;align-content:start}
.when{font-weight:650}
.place{color:var(--muted);font-size:0.9062rem}
.actions{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;margin-top:0.5rem}
.poster-embed{display:block;width:100%;aspect-ratio:4/5;border:0;background:#fff}
.shot-link{display:block;line-height:0}
.poster-shot{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.post-link{display:inline-flex;align-items:center;gap:0.375rem;min-height:2.75rem;font-size:0.9375rem;font-weight:600;text-underline-offset:3px;transition:color .28s var(--ease)}
.post-link:hover{color:var(--accent)}
.source-note{font-size:1.0625rem;color:var(--ink-2);margin-top:-1rem;max-width:62ch}
.empty{color:var(--muted);padding:1.5rem 0}

/* clubs */
.ev-title{font-weight:650;overflow-wrap:anywhere}
.row-item > div{min-width:0}
.row-item .post-link{min-height:2rem}

/* USC dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(14.375rem,100%),1fr));gap:1rem}
.kpi{background:var(--card);border-radius:var(--r-card);padding:1.125rem;box-shadow:var(--shadow);display:grid;gap:0.375rem;align-content:start;min-width:0}
.kpi .label{font-size:0.8438rem;color:var(--muted);font-weight:650}
.kpi .value{font:800 2.5rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.025em}

/* dialogs, toast, footer */
dialog.sheet{border:0;border-radius:1.75rem;padding:0;width:min(27.5rem,calc(100vw - 2rem));background:rgb(255 255 255 / .88);color:var(--ink);box-shadow:var(--rim),0 30px 80px rgb(20 20 26 / .55);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
dialog.sheet::backdrop{background:rgb(18 18 22 / .4)}
.sheet-body{padding:1.375rem;display:grid;gap:0.75rem}
.sheet-body label.field{font-weight:650;font-size:0.9062rem}
.hint{font-size:0.8438rem;color:var(--muted)}
.hint b{color:var(--ink)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:0.5rem}
legend{font-weight:650;font-size:0.9062rem;margin-bottom:0.375rem}
.radio{display:grid;grid-template-columns:1.25rem minmax(0,1fr);gap:0.625rem;align-items:start;padding:0.625rem 0.75rem;border-radius:0.625rem;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.radio:has(input:checked){box-shadow:inset 0 0 0 2px var(--ink)}
.radio input{margin:3px 0 0;width:1.125rem;height:1.125rem;accent-color:var(--ink)}
.radio small{display:block;color:var(--muted);font-size:0.8125rem}
.toast{position:fixed;left:50%;bottom:calc(var(--toast-lift) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgb(48 48 58 / .94);color:#FFF;padding:0.75rem 1rem;border-radius:0.75rem;font-weight:650;box-shadow:var(--shadow);width:max-content;max-width:calc(100vw - 2rem);z-index:30}
footer.foot{border-top:1px solid var(--line);padding-bottom:var(--foot-pad)}
footer.foot .wrap{padding-block:1.375rem;display:flex;flex-wrap:wrap;gap:0.625rem 1.25rem;align-items:center;justify-content:space-between;font-size:0.8438rem;color:var(--muted)}
.foot-note{display:flex;align-items:center;gap:0.75rem;flex:1 1 17.5rem;min-width:0}
.foot-note .usc-logo{width:2.25rem;height:2.25rem}
.foot-links{display:flex;flex-wrap:wrap;gap:0.25rem 1.125rem}
.noscript{margin:1rem;padding:1rem;border-radius:1rem;background:var(--bad-soft);color:var(--ink)}
.linkbtn{appearance:none;border:0;background:none;padding:0.375rem 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:0.8438rem}

/* walkthrough: a spotlight on the real interface and a card that explains it */
dialog.tour{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:var(--ink);overflow:hidden}
dialog.tour::backdrop{background:transparent}
.tour-spot{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:1.25rem;box-shadow:0 0 0 3px var(--accent),0 0 22px 4px rgb(79 38 131 / .45),0 0 0 200vmax rgb(18 18 22 / .55);pointer-events:none;transition:left .46s var(--ease),top .46s var(--ease),width .46s var(--ease),height .46s var(--ease),opacity .3s ease}
.tour-spot.off{box-shadow:0 0 0 200vmax rgb(18 18 22 / .55)}
.tour-anchor{position:fixed;left:50%;top:50%;width:0;height:0;transition:left .46s var(--ease),top .46s var(--ease)}
.tour-card{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:min(27rem,100vw - 1.5rem);max-height:calc(100dvh - 1.5rem);overflow-y:auto;display:grid;gap:0.625rem;padding:1.375rem;border-radius:1.75rem;background:rgb(255 255 255 / .9);box-shadow:var(--rim),0 24px 70px rgb(20 20 26 / .5);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%)}
.lg-on .tour-card{position:static;transform:none;background:rgb(255 255 255 / .74);box-shadow:var(--rim);-webkit-backdrop-filter:none;backdrop-filter:none}
.lg-on .tour-anchor .glass{display:flex!important;vertical-align:top}
.lg-frost-only .tour-card{background:rgb(255 255 255 / .94)}
/* A dialog is always its own stacking context, so blending here would isolate the card and stop its blur. */
.tour-anchor > span{mix-blend-mode:normal!important}
.view-ghost{position:fixed;z-index:12;margin:0;pointer-events:none}
.text-input{width:100%;font-size:1rem;padding:0.75rem 0.875rem;border-radius:0.75rem;border:1.5px solid var(--line);background:rgb(255 255 255 / .7);color:var(--ink)}
.text-input:focus{outline:3px solid var(--accent);outline-offset:1px}
.role-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.5rem}
.role-pick .radio{align-items:center}
@media (max-width:420px){.role-pick{grid-template-columns:1fr}}
.chat-log{display:flex;flex-direction:column;gap:0.5rem;height:min(46dvh,24rem);overflow-y:auto;padding:0.25rem}
.chat-msg{max-width:88%;padding:0.625rem 0.875rem;border-radius:1rem;background:var(--tint);overflow-wrap:anywhere;animation:fadein .3s ease both}
.chat-msg.me{align-self:flex-end;background:#EDE9F5}
.chat-msg img{display:block;width:8rem;border-radius:0.5rem;margin-top:0.5rem}
.chat-actions{display:flex;flex-wrap:wrap;gap:0.5rem}
.chat-actions:empty{display:none}
.chat-form{display:flex;gap:0.5rem}
.chat-form[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lg-creds{display:grid;gap:0.5rem}
.row.spread{justify-content:space-between}
.rows{list-style:none;margin:0;padding:0;display:grid}
.row-item{display:flex;flex-wrap:wrap;gap:0.75rem 1rem;align-items:center;justify-content:space-between;padding:0.875rem 0;border-top:1px solid var(--line)}
.row-item:first-child{border-top:0;padding-top:0.25rem}
.grow{flex:1 1 14rem;min-width:0}
.ev-title{font-weight:650;overflow-wrap:anywhere}
.row-item > div{min-width:0}
.row-item .post-link{min-height:2rem}
.pill{font-size:0.8125rem;font-weight:650;padding:0.25rem 0.625rem;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--good-soft);color:var(--good)}
.pill.declined{background:var(--bad-soft);color:var(--bad)}
.chat-actions .btn{white-space:normal;text-align:left}
.top-actions{position:relative;display:flex;align-items:center;gap:0.5rem;flex:none}
/* past events: a tidy gallery, muted until you point at one */
.past{display:grid;gap:1rem;margin-top:1.5rem}
.past-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(13.5rem,46%),1fr));gap:1.5rem 1rem}
.past-card{display:grid;gap:0.25rem;align-content:start;min-width:0;text-decoration:none;color:inherit}
.past-shot{display:block;width:100%;aspect-ratio:1;object-fit:cover;object-position:top;border-radius:1.125rem;margin-bottom:0.5rem;background:var(--card);filter:saturate(.55) opacity(.92);box-shadow:0 6px 18px rgb(20 20 26 / .12);transition:filter .32s var(--ease),transform .32s var(--ease),box-shadow .32s var(--ease)}
.past-date{font-size:0.8125rem;font-weight:600;color:var(--muted)}
.past-title{font:700 1.0625rem/1.25 var(--font-body)}
.past-meta{font-size:0.875rem;color:var(--muted)}
.past-card:hover .past-title{color:var(--accent)}
@media (hover:hover){.past-card:hover .past-shot{filter:none;transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--accent),0 12px 30px rgb(79 38 131 / .18)}}
.req-shot{flex:none;width:4.5rem;height:5.5rem;object-fit:cover;border-radius:0.75rem}
/* messages: a plain two-pane inbox; one pane at a time on a phone */
.msg-app{display:grid;grid-template-columns:minmax(0,20rem) minmax(0,1fr);height:min(70dvh,42rem);min-height:26rem;border-radius:var(--r-card);overflow:hidden;background:rgb(255 255 255 / .72);box-shadow:var(--shadow)}
.inbox{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.new-chat{display:grid;gap:0.25rem;padding:0.875rem;font-size:0.8125rem;font-weight:600;border-bottom:1px solid var(--line)}
.inbox-list{overflow-y:auto;flex:1;min-height:0}
.inbox-none{padding:1rem}
.inbox-item{appearance:none;border:0;display:grid;gap:0.25rem;width:100%;text-align:left;padding:0.875rem;background:none;color:inherit;cursor:pointer;border-bottom:1px solid var(--line);min-height:3.75rem;transition:background .24s var(--ease)}
.inbox-item:hover{background:var(--accent-soft)}
.inbox-item[aria-current="true"]{background:rgb(0 0 0 / .07)}
.inbox-top,.inbox-bottom{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;min-width:0}
.inbox-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-top time{flex:none;font-size:0.75rem;color:var(--muted)}
.inbox-preview{font-size:0.875rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.unread{flex:none;display:inline-grid;place-items:center;min-width:1.25rem;height:1.25rem;padding:0 0.3125rem;border-radius:999px;background:var(--accent);color:#FFF;font:700 0.75rem/1 var(--font-body)}
.tab-badge{position:absolute;top:0.125rem;right:0.25rem}

    <form class="chat-form" id="chat-form" novalidate><label class="sr-only" for="chat-input">Your answer</label><input id="chat-input" class="text-input" autocomplete="off"><button class="btn" type="submit" data-testid="chat-send">Send</button></form>
  </div>
</dialog>

<dialog id="tour" class="tour" aria-labelledby="tour-title" aria-describedby="tour-text" data-testid="tour">
  <div class="tour-spot off" id="tour-spot" data-testid="tour-spot"></div>
  <div class="tour-anchor" id="tour-anchor">
    <div class="tour-card" id="tour-card" data-testid="tour-card">
      <div class="tour-media" id="tour-media"></div>
      <p class="tour-count" id="tour-count" data-testid="tour-count"></p>
      <div aria-live="polite" style="display:grid;gap:8px">
        <h2 class="tour-title" id="tour-title" data-testid="tour-title"></h2>
        <p class="tour-text" id="tour-text" data-testid="tour-text"></p>
      </div>
      <div class="tour-bar" aria-hidden="true"><i id="tour-progress"></i></div>
      <div class="tour-actions">
        <button class="linkbtn" type="button" data-act="tour-skip" data-testid="tour-skip">Skip</button>
        <span class="grow"></span>
        <button class="btn ghost" type="button" data-act="tour-back" data-testid="tour-back">Back</button>
        <button class="btn" type="button" data-act="tour-next" data-testid="tour-next" id="tour-next">Next</button>

<button class="ask-fab" id="ask-fab" type="button" data-act="ask" aria-expanded="false" aria-controls="ask-panel" data-testid="ask-fab">Ask Purple Hub</button>
<section class="ask-panel" id="ask-panel" aria-label="Ask Purple Hub" data-testid="ask-panel" hidden>
  <div class="row spread ask-head"><h2 class="h3">Ask Purple Hub</h2><button class="linkbtn" type="button" data-act="ask-close" data-testid="ask-close">Close</button></div>
  <div class="chat-log ask-log" id="ask-log" role="log" aria-live="polite" data-testid="ask-log"></div>
  <div class="chat-actions" id="ask-actions"></div>
  <form class="chat-form" id="ask-form" novalidate><label class="sr-only" for="ask-input">Your question</label><input id="ask-input" class="text-input" autocomplete="off" maxlength="500" placeholder="Ask a question" data-testid="ask-input"><button class="btn" type="submit" data-testid="ask-send">Send</button></form>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  'use strict';

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = (n) => '$' + Number(n).toLocaleString('en-CA', { maximumFractionDigits: 2 });
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- clubs and events: real ones from src/data.json, plus approved club posts from the server ---------- */
  const DATA = {{DATA}};
  const EVENT_IMG = {{EVENT_IMAGES}};
  const CLUBS = DATA.clubs, CATEGORIES = DATA.categories;
  const POST = (code) => 'https://www.instagram.com/p/' + code + '/';
  const STATIC_EVENTS = DATA.events.map((e) => ({ ...e, at: new Date(e.at).getTime(), ends: e.ends ? new Date(e.ends).getTime() : 0, post: POST(e.code) }));
  let EVENTS = STATIC_EVENTS.slice();
  const shot = (e) => e.img || EVENT_IMG[e.shot || e.id];
  const live = (e) => !e.past && (e.ends || 0) >= Date.now();
  const postLink = (e) => (e.post ? '<a class="post-link" href="' + e.post + '" target="_blank" rel="noopener">View on Instagram</a>' : '');

  /* ---------- talking to the server ---------- */
  const OFFLINE = location.protocol === 'file:';
  async function api(path, body, method) {
    if (OFFLINE) throw new Error('This needs the Purple Hub server. Open Purple Hub from its web address to use this.');
    const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), headers: { 'content-type': 'application/json', 'x-purplehub': '1' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
    return j;
  }
  let D = { funded: [], user: null, posts: [], mine: [], requests: [], funding: [], threads: [] };
  const UI = { q: '', club: 'All', cat: 'All', thread: null, draftInbox: null };
  const unreadTotal = () => D.threads.reduce((t, x) => t + x.unread, 0);
  // Reloads everything this person may see. New messages arrive here too, pushed by the stream below.
  async function refresh(announce) {
    if (OFFLINE) return;
    const before = new Map(D.threads.map((t) => [t.id, t.unread])), hadUser = D.user && D.user.id, wasFund = new Map(D.funding.map((f) => [f.id, f.status]));
    D = await api('/api/data');
    EVENTS = [...STATIC_EVENTS, ...D.posts];
    if (D.user && hadUser !== D.user.id) openStream();
    if (!D.user) closeStream();
    if (announce) {
      const fresh = D.threads.find((t) => t.unread > (before.get(t.id) || 0) && !(current() === 'messages' && UI.thread === t.id));
      if (fresh) toast('New message from ' + fresh.title);
      if (isClub()) { const f = D.funding.find((x) => wasFund.get(x.id) === 'pending' && x.status !== 'pending'); if (f) toast('The USC ' + (f.status === 'approved' ? 'approved' : 'declined') + ' your funding request for ' + f.event + '.'); }
    }
    if (current() === 'week' && $('#feed')) { renderLists(); renderAccount(); } else render();
    markOpenThreadRead();
  }
  let stream = null, poll = 0;
  function openStream() {
    closeStream();
    if (!window.EventSource) return;
    stream = new EventSource('/api/stream');
    stream.addEventListener('change', () => { refresh(true).catch(() => {}); });
    // Hosted on Vercel the connection is refused, so check for updates every few seconds instead.
    stream.onerror = () => { if (stream && stream.readyState === 2) { closeStream(); poll = setInterval(() => { if (!document.hidden) refresh(true).catch(() => {}); }, 8000); } };
  }
  function closeStream() { if (stream) { stream.close(); stream = null; } clearInterval(poll); poll = 0; }
  const act = (p) => p.catch((e) => { toast(e.message); });
  const me = () => D.user;
  const isAdmin = () => !!me() && me().role === 'admin' && me().approved;
  const isClub = () => !!me() && me().role === 'club' && me().approved;
  const firstName = (u) => { const n = u.name.replace(/\s*\(.*\)/, '').split(' ')[0]; return n.length > 12 ? n.slice(0, 11) + '…' : n; };
  function gateHTML(role, title) {
    const words = { admin: ['USC staff only', 'Sign in with your USC account to see this page.'], club: ['Club presidents only', 'Sign in with your Western email to post events and request funding.'], messages: ['Sign in to message', 'Create a free account with your Western email to message the USC or a club, and get their replies here.'] }[role];
    return '<header class="view-head"><h1 class="h1">' + title + '</h1></header>' +
      '<section class="panel gate" data-testid="gate-' + role + '"><h2 class="h3">' + words[0] + '</h2><p>' + words[1] + '</p>' +
      '<div class="row"><button class="btn" type="button" data-act="login" data-v="in">Sign in</button><button class="btn ghost" type="button" data-act="login" data-v="up">Create account</button></div></section>';
  }

  /* ---------- our own dropdown, so it looks the same everywhere instead of using the browser's ---------- */
  const ddChange = {};
  function ddHTML(id, label, opts, value) {
    const cur = opts.find((o) => o[0] === value) || opts[0];
    return '<div class="dd" id="' + id + '" data-value="' + esc(cur[0]) + '"><button type="button" class="dd-btn" data-act="dd" aria-haspopup="listbox" aria-expanded="false" aria-label="' + esc(label) + '" data-testid="' + id + '"><span class="dd-label">' + esc(cur[1]) + '</span><span class="dd-chev" aria-hidden="true"></span></button>' +
      '<ul class="dd-menu" role="listbox" aria-label="' + esc(label) + '" hidden>' + opts.map((o) => '<li role="option" tabindex="-1" data-act="dd-opt" data-v="' + esc(o[0]) + '" aria-selected="' + (o[0] === cur[0]) + '" data-testid="' + id + '-opt-' + esc(o[0]) + '">' + esc(o[1]) + '</li>').join('') + '</ul></div>';
  }
  function ddClose(dd, refocus) {
    dd.querySelector('.dd-menu').hidden = true;
    dd.querySelector('.dd-btn').setAttribute('aria-expanded', 'false');
    if (refocus) dd.querySelector('.dd-btn').focus();
  }
  const ddCloseAll = (except) => document.querySelectorAll('.dd').forEach((d) => { if (d !== except) ddClose(d); });
  function ddOpen(dd) {
    ddCloseAll(dd);
    const menu = dd.querySelector('.dd-menu');
    menu.hidden = false;
    dd.querySelector('.dd-btn').setAttribute('aria-expanded', 'true');
    (menu.querySelector('[aria-selected="true"]') || menu.firstElementChild).focus();
  }
  function ddPick(li) {
    const dd = li.closest('.dd');
    dd.dataset.value = li.dataset.v;
    dd.querySelector('.dd-label').textContent = li.textContent;
    dd.querySelectorAll('[role="option"]').forEach((o) => o.setAttribute('aria-selected', o === li));
    ddClose(dd, true);
    if (ddChange[dd.id]) ddChange[dd.id](li.dataset.v);
  }
  document.addEventListener('keydown', (e) => {
    const dd = e.target.closest && e.target.closest('.dd');
    if (!dd) return;
    const menu = dd.querySelector('.dd-menu'), open = !menu.hidden;
    if (!open) { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ddOpen(dd); } return; }
    const items = [...menu.children], at = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); (items[at + 1] || items[0]).focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (items[at - 1] || items[items.length - 1]).focus(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (items[at]) ddPick(items[at]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ddClose(dd, true); }
    else if (e.key === 'Tab') ddClose(dd);
  });

  /* ---------- home: happening today, upcoming and past events ---------- */
  const isFunded = (e) => (D.funded || []).some((f) => f.club === e.club && f.event === e.title);
  const fundedTag = (e) => (isFunded(e) ? '<span class="funded-tag" data-testid="funded-' + e.id + '">USC funded</span>' : '');
  function mediaHTML(e, c) {
    const alt = 'Picture of ' + esc(c.short) + '’s post for ' + esc(e.title) + '.';
    if (shot(e)) {
      const img = '<img class="poster-shot" src="' + shot(e) + '" alt="' + alt + '">';
      return e.post ? '<a class="shot-link" href="' + e.post + '" target="_blank" rel="noopener" aria-label="Open the ' + esc(e.title) + ' post on Instagram">' + img + '</a>' : img;
    }
    return '<iframe class="poster-embed" src="' + e.post + 'embed/" loading="lazy" title="' + esc(c.short) + '’s Instagram post for ' + esc(e.title) + '" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>';
  }
  function posterHTML(e) {
    const c = CLUBS[e.club];
    return '<article class="poster" data-testid="event-' + e.id + '">' + mediaHTML(e, c) +
      '<div class="poster-body"><p class="club-line">' + esc(c.name) + '</p><h3 class="poster-title">' + esc(e.title) + '</h3>' + fundedTag(e) +
      '<p class="when">' + esc(e.date) + '</p><p class="place">' + esc(e.place) + '</p><div class="actions">' + postLink(e) + '</div></div></article>';
  }
  function matches(e) {
    const c = CLUBS[e.club], q = UI.q.trim().toLowerCase();
    if (UI.club !== 'All' && e.club !== UI.club) return false;
    if (UI.cat !== 'All' && e.cat !== UI.cat) return false;
    return !q || [e.title, c.name, c.short, e.place, e.date, e.cat, e.hosts || ''].join(' ').toLowerCase().includes(q);
  }
  // Weekly series stay in Upcoming: they run on and off, and this list only shows what's certain to be on today.
  function isToday(e) { const end = new Date(); end.setHours(23, 59, 59, 999); return live(e) && !e.weekly && e.at <= end.getTime(); }
  function todayHTML(e) {
    const c = CLUBS[e.club];
    return '<article class="poster today-card" data-testid="event-' + e.id + '">' + mediaHTML(e, c) +
      '<div class="today-body"><p class="today-badge"><span class="live-dot" aria-hidden="true"></span>On today</p><p class="club-line">' + esc(c.name) + '</p><h3 class="today-title">' + esc(e.title) + '</h3>' + fundedTag(e) + '<p class="when">' + esc(e.date) + '</p><p class="place">' + esc(e.place) + '</p><div class="actions">' + postLink(e) + '</div></div></article>';
  }
  function renderLists() {
    const today = EVENTS.filter(isToday).filter(matches);
    $('#today-sec').hidden = !today.length;
    $('#today').innerHTML = today.map(todayHTML).join('');
    const up = EVENTS.filter(live).filter((e) => !isToday(e)).filter(matches).sort((a, b) => a.ends - b.ends);
    const past = EVENTS.filter((e) => !live(e)).filter(matches).sort((a, b) => b.at - a.at);
    $('#feed').innerHTML = up.map(posterHTML).join('') || '<p class="empty">No upcoming events match that.</p>';
    $('#past-grid').innerHTML = past.map((e) => {
      const inner = (shot(e) ? '<img class="past-shot" src="' + shot(e) + '" alt="">' : '<span class="past-shot"></span>') +
        '<span class="past-date">' + esc(e.date) + '</span><span class="past-title">' + esc(e.title) + '</span>' + fundedTag(e) + '<span class="past-meta">' + esc(e.hosts || CLUBS[e.club].short) + '</span>';
      return e.post ? '<a class="past-card" data-testid="past-' + e.id + '" href="' + e.post + '" target="_blank" rel="noopener" aria-label="' + esc(e.title) + ', ' + esc(e.date) + '. Open on Instagram">' + inner + '</a>' : '<div class="past-card" data-testid="past-' + e.id + '">' + inner + '</div>';
    }).join('') || '<p class="empty">No past events match that.</p>';
  }
  function renderWeek() {
    $('#view-week').innerHTML =
      '<div class="tools" id="event-tools" data-testid="tools">' +
        '<label class="tool grow"><span>Search</span><input id="ev-search" class="text-input" type="search" placeholder="Search events" value="' + esc(UI.q) + '" data-testid="search"></label>' +
        '<div class="tool"><span>Sort by club</span>' + ddHTML('sort-club', 'Sort by club', [['All', 'All clubs'], ...Object.values(CLUBS).map((c) => [c.id, c.short])], UI.club) + '</div>' +
        '<div class="tool"><span>Category</span>' + ddHTML('sort-cat', 'Category', [['All', 'All categories'], ...CATEGORIES.map((c) => [c, c])], UI.cat) + '</div>' +
      '</div>' +
      '<section class="today-sec" id="today-sec" data-testid="today" hidden><h2 class="h1 sec-title">Happening today</h2><div class="today-list" id="today"></div></section>' +
      '<section class="up-sec"><h2 class="h1 sec-title">Upcoming events</h2><div class="feed" id="feed" data-testid="feed"></div></section>' +
      '<section class="past" data-testid="recent"><h2 class="h2">Past events</h2><div class="past-grid" id="past-grid"></div></section>';
    renderLists();
  }

  const pickFilter = () => { renderLists(); fade($('#feed')); rise(document.querySelectorAll('#feed .poster')); };
  ddChange['sort-club'] = (v) => { UI.club = v; pickFilter(); };
  ddChange['sort-cat'] = (v) => { UI.cat = v; pickFilter(); };

  /* ---------- club presidents: their posts and funding requests ---------- */
  const STATUS = { pending: 'Waiting for USC approval', approved: 'Approved', declined: 'Declined' };
  const FUNDING = { pending: 'waiting for the USC', approved: 'approved', declined: 'declined' };
  const pill = (status, text) => '<span class="pill ' + status + '">' + esc(text) + '</span>';
  const noteLine = (x) => (x.note ? '<p class="decision-note">USC: ' + esc(x.note) + '</p>' : '');
  function budgetHTML(f) {
    return '<table class="budget-table"><tbody>' + f.items.map((x) => '<tr><td>' + esc(x.what) + '</td><td class="num">' + money(x.cost) + '</td></tr>').join('') + '</tbody><tfoot><tr><td>Total</td><td class="num">' + money(f.amount) + '</td></tr></tfoot></table>';
  }
  const FUND_STATUS = { pending: 'Waiting for USC', approved: 'Approved', declined: 'Declined' };
  function renderClubs() {
    const u = me();
    if (!u || u.role !== 'club') { $('#view-clubs').innerHTML = gateHTML('club', 'For clubs'); return; }
    const c = CLUBS[u.club];
    const listed = STATIC_EVENTS.filter((e) => e.club === c.id && live(e)).sort((a, b) => a.ends - b.ends);
    $('#view-clubs').innerHTML =
      '<header class="view-head"><h1 class="h1">' + esc(c.name) + '</h1><p class="small">Signed in as ' + esc(u.email) + '</p></header>' +
      '<section class="panel"><div class="row spread"><h2 class="h3">Your posts</h2><button class="btn small" type="button" data-act="chat" data-testid="chat-open">Add a post</button></div>' +
        (D.mine.length ? '<ul class="rows">' + D.mine.map((p) => '<li class="row-item" data-testid="mine-' + p.id + '"><div><p class="ev-title">' + esc(p.title) + '</p><p class="small muted">' + esc(p.date) + ' · ' + esc(p.place) + '</p>' + noteLine(p) + '</div><div class="row">' + pill(p.status, STATUS[p.status]) + '<button class="btn ghost small" type="button" data-act="remove-post" data-id="' + p.id + '" data-testid="remove-' + p.id + '">Remove</button></div></li>').join('') + '</ul>'
          : '<p class="muted">Nothing yet. Add a post, and the USC will review it before it appears on Home.</p>') + '</section>' +
      '<section class="panel"><div class="row spread"><h2 class="h3">Funding from the USC</h2><button class="btn small" type="button" data-act="fund-start" data-testid="fund-start">Apply for funding</button></div>' +
        (D.funding.length ? '<ul class="rows">' + D.funding.map((f) => '<li class="row-item" data-testid="myfund-' + f.id + '"><div class="grow"><p class="ev-title">' + esc(f.event) + ' · ' + (f.status === 'approved' ? money(f.approvedAmount) + ' of ' + money(f.amount) : money(f.amount)) + '</p><p class="small muted">Needed by ' + esc(f.neededBy) + '</p>' + noteLine(f) + '</div>' + pill(f.status, FUND_STATUS[f.status]) + '</li>').join('') + '</ul>'
          : '<p class="muted">Need money for an event? Fill in the application, and the USC replies here.</p>') + '</section>' +
      (listed.length ? '<section class="panel"><h2 class="h3">Already on Home</h2><ul class="rows">' + listed.map((e) => '<li class="row-item"><div><p class="ev-title">' + esc(e.title) + '</p><p class="small muted">' + esc(e.date) + ' · ' + esc(e.place) + '</p></div>' + postLink(e) + '</li>').join('') + '</ul></section>' : '');
  }

  /* ---------- USC: approvals, funding and new club presidents ---------- */
  const decideButtons = (kind, id, yes) => '<label class="note-field"><span>Note to the club (needed if you decline)</span><input class="text-input" id="note-' + kind + '-' + id + '" maxlength="300" autocomplete="off" data-testid="note-' + kind + '-' + id + '"></label><div class="decide"><button class="btn yes" type="button" data-act="decide" data-kind="' + kind + '" data-v="approved" data-id="' + id + '" data-testid="approve-' + kind + '-' + id + '">' + yes + '</button><button class="btn no" type="button" data-act="decide" data-kind="' + kind + '" data-v="declined" data-id="' + id + '" data-testid="decline-' + kind + '-' + id + '">Decline</button></div>';
  function postCard(p) {
    return '<article class="review-card" data-testid="request-' + p.id + '">' + (p.img ? '<img class="req-shot" src="' + p.img + '" alt="">' : '') + '<div class="grow"><p class="review-kicker">' + esc(CLUBS[p.club].short) + ' · new post</p><h3 class="review-title">' + esc(p.title) + '</h3><p class="small muted">' + esc(p.date) + ' · ' + esc(p.place) + ' · ' + esc(p.cat) + '</p>' + postLink(p) +
      (p.status === 'pending' ? decideButtons('post', p.id, 'Approve post') : '<div class="row">' + pill(p.status, STATUS[p.status]) + '</div>' + noteLine(p)) + '</div></article>';
  }
  const CHECKS = ['The budget looks reasonable for this event', 'The event benefits students beyond the club', 'The club can account for the money'];
  function fundCard(f) {
    const x = f.details || {}, o = x.other || {}, each = f.attendance ? f.amount / f.attendance : 0, row = (a, b) => (b ? '<dt>' + a + '</dt><dd>' + esc(b) + '</dd>' : '');
    const others = (o.club || 0) + (o.tickets || 0) + (o.sponsors || 0);
    const decision = f.status === 'pending'
      ? '<fieldset class="review-checks"><legend>USC review checklist</legend>' + CHECKS.map((c, i) => '<label class="agree"><input type="checkbox" id="check-' + f.id + '-' + i + '" data-testid="check-' + f.id + '-' + i + '"><span>' + c + '</span></label>').join('') + '</fieldset>' +
        '<label class="note-field amount-field"><span>Amount to approve (up to ' + money(f.amount) + ')</span><span class="money-input"><span aria-hidden="true">$</span><input class="text-input" inputmode="decimal" id="amount-' + f.id + '" value="' + f.amount + '" data-testid="amount-' + f.id + '"></span></label>' +
        '<label class="note-field"><span>Note to the club (needed either way)</span><input class="text-input" id="note-funding-' + f.id + '" maxlength="300" autocomplete="off" data-testid="note-funding-' + f.id + '"></label>' +
        '<div class="decide"><button class="btn yes" type="button" data-act="decide" data-kind="funding" data-v="approved" data-id="' + f.id + '" data-testid="approve-funding-' + f.id + '">Approve funding</button><button class="btn no" type="button" data-act="decide" data-kind="funding" data-v="declined" data-id="' + f.id + '" data-testid="decline-funding-' + f.id + '">Decline</button></div>'
      : '<div class="row">' + pill(f.status, f.status === 'approved' ? 'Approved ' + money(f.approvedAmount) : FUND_STATUS[f.status]) + '</div>' + noteLine(f);
    return '<article class="review-card fund-card" data-testid="funding-' + f.id + '"><div class="grow"><div class="row spread"><div><p class="review-kicker">' + esc(CLUBS[f.club].short) + ' · funding application</p><h3 class="review-title">' + esc(f.event) + '</h3></div><p class="review-amount">' + money(f.amount) + '</p></div>' +
      '<dl class="review-list">' + row('Event', [x.eventDate, x.location, x.eventType].filter(Boolean).join(', ')) + row('Open to', x.openToAll === undefined ? '' : x.openToAll ? 'All students' : 'Members only') + row('Why', f.purpose) + row('Benefit', x.benefit) + row('People', f.attendance + ' expected' + (x.nonMembers !== undefined ? ', ' + x.nonMembers + ' non-members' : '') + ', about ' + money(Math.round(each * 100) / 100) + ' each') + row('Measure', x.measure) + row('Treasurer', x.treasurer ? x.treasurer + (x.contact ? ', ' + x.contact : '') : '') + row('Signed', x.signature) + row('Needed by', f.neededBy) + '</dl>' +

    { ask: 'What’s the event called?', input: 'text', take(v, d) { if (!v || v.length > 80) return 'Please give it a name of up to 80 characters.'; d.title = v; } },
    { ask: 'When is it? For example: Thursday, Nov 12, 6 to 8 p.m.', input: 'text', take(v, d) { if (!v || v.length > 80) return 'Please give a day and time, up to 80 characters.'; d.date = v; } },
    { ask: 'Where is it?', input: 'text', take(v, d) { if (!v || v.length > 100) return 'Please give a place, up to 100 characters.'; d.place = v; } },

  function readPicture(file) {

  let tourGliding = false, tourGlideTimer = 0;
  function placeTour(dy = 0) {
    if (tourAt < 0) return;
    const spot = $('#tour-spot'), card = $('#tour-card'), anchor = $('#tour-anchor');
    const vw = innerWidth, vh = innerHeight, gap = 16, edge = 12;
    const w = card.offsetWidth, h = card.offsetHeight;
    const fitX = (x) => Math.min(Math.max(x, edge + w / 2), vw - edge - w / 2);
    const fitY = (y) => Math.min(Math.max(y, edge + h / 2), vh - edge - h / 2);
    let cx = vw / 2, cy = vh / 2;
    const t = TOUR[tourAt].target ? TOUR[tourAt].target() : null;
    if (t && t.getClientRects().length) {
      const b = t.getBoundingClientRect(), pad = 6;
      const r = { left: b.left, right: b.right, width: b.width, height: b.height, top: b.top - dy, bottom: b.bottom - dy };

      if (vh - r.bottom - pad >= h + gap + edge) cy = r.bottom + pad + gap + h / 2;
      else if (r.top - pad >= h + gap + edge) cy = r.top - pad - gap - h / 2;
      else if (vw - r.right - pad >= w + gap + edge) { cx = r.right + pad + gap + w / 2; cy = r.top + h / 2; }
      else if (r.left - pad >= w + gap + edge) { cx = r.left - pad - gap - w / 2; cy = r.top + h / 2; }

    if (!(e.target.closest && e.target.closest('.dd'))) ddCloseAll();
    if (!(e.target.closest && e.target.closest('.top-actions'))) toggleAccountMenu(false);
    const closer = e.target.closest('[data-close]');
    if (closer) { const d = closer.closest('dialog'); if (d) closeDialog(d); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id, v = b.dataset.v;
    switch (b.dataset.act) {
      case 'ask': toggleAsk(); break;
      case 'ask-close': toggleAsk(false); break;
      case 'tour-reset': resetTour(); break;
      case 'chat': openChat(); break;
      case 'thread': UI.thread = v; UI.draftInbox = null; if ($('#msg-input')) $('#msg-input').value = ''; renderMessages(); fade($('#msg-log')); markOpenThreadRead(); if ($('#msg-input')) $('#msg-input').focus({ preventScroll: true }); break;
      case 'thread-back': UI.thread = null; UI.draftInbox = null; if ($('#msg-input')) $('#msg-input').value = ''; renderMessages(); break;
      case 'remove-post': act(api('/api/posts/' + id, undefined, 'DELETE').then(() => refresh()).then(() => toast('Post removed.'))); break;
      case 'dd': { const dd = b.closest('.dd'); if (dd.querySelector('.dd-menu').hidden) ddOpen(dd); else ddClose(dd); break; }
      case 'dd-opt': ddPick(b); break;
      case 'fund-start': openFund(); break;
      case 'fund-add': FUND.d.items.push({ what: '', cost: '' }); renderFund(); break;
      case 'fund-del': FUND.d.items.splice(Number(v), 1); renderFund(); break;
      case 'fund-back': FUND.step--; renderFund(); break;
      case 'decide': {
        const kind = b.dataset.kind, note = $('#note-' + kind + '-' + id).value.trim(), body = { status: v, note };
        if (kind === 'funding') {
          if (!note) { toast('Please add a note explaining your decision.'); $('#note-funding-' + id).focus(); break; }
          if (v === 'approved') {
            body.checked = CHECKS.every((c, i) => $('#check-' + id + '-' + i).checked);
            body.approvedAmount = Number($('#amount-' + id).value.replace(/[$,\s]/g, ''));
            if (!body.checked) { toast('Please complete the review checklist first.'); break; }
          }
        } else if (v === 'declined' && !note) { toast('Please add a short note saying why.'); $('#note-' + kind + '-' + id).focus(); break; }
        const card = b.closest('.review-card');
        act(api(kind === 'post' ? '/api/posts/' + id + '/review' : '/api/funding/' + id + '/decide', body).then(async () => {
          if (card && card.animate && !still()) await card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(' + (v === 'approved' ? 24 : -24) + 'px)' }], { duration: 260, easing: 'ease', fill: 'forwards' }).finished;
          await refresh();
          toast(v === 'approved' ? (kind === 'post' ? 'Approved. It’s on Home now.' : 'Funding approved.') : 'Declined. The club can see your note.');
        }));
        break;
      }
      case 'account': if (me()) toggleAccountMenu($('#account-menu').hidden); else openLogin('in'); break;
      case 'demo-login': $('#lg-email').value = v; $('#lg-pass').value = D.demoPassword; $('#lg-err').textContent = ''; $('#lg-form').requestSubmit(); break;
      case 'login': openLogin(v); break;
      case 'login-mode': setLoginMode(v); break;
      case 'signout': act(api('/api/logout', {}).then(() => { toggleAccountMenu(false); CHAT.reset(); UI.thread = null; UI.draftInbox = null; return refresh(); }).then(() => { render(); fade($('#view-' + current())); toast('Signed out.'); })); break;
      case 'tour-next': nextTourStep(); break;
      case 'tour-back': showTourStep(tourAt - 1); break;
      case 'tour-skip': endTour(); break;
      default: break;
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') toggleAccountMenu(false);
    if (e.key === 'Escape' && !$('#ask-panel').hidden && !document.querySelector('dialog[open]')) toggleAsk(false); });
  ddChange['new-chat'] = (inbox) => {
    if (!inbox) return;
    const have = D.threads.find((t) => t.inbox === inbox && t.title === inboxLabel(inbox));
    UI.thread = have ? have.id : null; UI.draftInbox = have ? null : inbox;
    renderMessages(); markOpenThreadRead(); if ($('#msg-input')) $('#msg-input').focus();
  };

    route();
  if (!tourSeen()) startTour();
  refresh().catch(() => {});
})();
</script>
